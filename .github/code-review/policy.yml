# Code review bot, reviewing itself. Overrides the bot's own defaults; anything
# absent keeps the default. See reviewbot/defaults/policy.yml.

# Codex first, so this repository dogfoods the backend that gets the least
# exercise elsewhere.
#
# `fallback`, NOT `first`, and the difference is not cosmetic. Under `first`,
# base.run() returns `[ready[0].review(brief)]` and a BackendError propagates
# to `_fail` -- Claude is never tried, because it was moved into `missing` the
# moment Codex probed live. So a credential that is PRESENT BUT BROKEN (an
# expired access token, a codex CLI error, two malformed answers) would end the
# review with a neutral "Bot error" and no comment. `CodexBackend.probe()`
# returns True as soon as $CODEX_HOME/auth.json exists, so a stale published
# copy is exactly that state.
#
# Under `fallback` the same failure moves to Claude and the review still
# publishes, which is what the spec's failure table and docs/setup.md both
# promise.
backends: [codex, claude]
mode: fallback
