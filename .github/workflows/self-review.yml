name: Self review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

jobs:
  review:
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '@marketdata-code-review'))
    uses: ./.github/workflows/review.yml
    secrets: inherit
    with:
      # Run the bot from the default branch, never from the pull request's
      # own head: a pull request must not be reviewed by the code it is
      # proposing (spec section 6). It also means there is no dependency on a
      # v1 tag existing yet.
      bot-ref: main
