name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'

      - name: Install the package and dev tools
        run: uv sync --extra dev

      # The default test run must never touch a live model or live GitHub.
      # The e2e smoke is excluded by addopts in pyproject.toml.
      # MEASURED 2026-09-16, and the answer was no: a job summary does NOT
      # reach the check run output. This job wrote one and its check run still
      # came back `summary_len=0 text_len=0` from
      # GET /repos/{repo}/commits/{sha}/check-runs.
      #
      # So the review bot cannot read test results this way. It needs either
      # `actions: read` on the App (to fetch job logs) or an action that
      # creates its OWN check run with populated output, the way codecov does
      # -- codecov's check carries 2 KB of text on the same commit where every
      # `test (3.x)` check carries none.
      #
      # The summary is kept because it is genuinely useful to a human reading
      # the run. It is not wired to the reviewer, and the comment says so to
      # stop the experiment being repeated.
      - name: Run the tests
        id: tests
        run: |
          set -o pipefail
          uv run pytest -v --tb=short 2>&1 | tee /tmp/pytest.out

      - name: Publish the test results for the reviewer
        if: always()
        run: |
          {
            echo "### Test results"
            echo
            echo '```'
            tail -c 30000 /tmp/pytest.out 2>/dev/null || echo "no test output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check linting (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .
