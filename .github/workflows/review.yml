name: Code review

# The engine. A target repository names the secrets explicitly when it calls
# this; `secrets: inherit` only delivers within one organisation, and the
# sdk-* repositories are on a user account. See docs/caller-workflow.yml.
#
# This job runs with the caller's secrets on a pull_request_target event, so
# it must never execute anything from the pull request. It installs the bot
# from this repository, checks the pull request out read-only with no
# credentials, and hands the model a read-only sandbox.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          OPTIONAL override, as a JSON string. Leave it unset and the runner
          is chosen from the repository's visibility, which is the only choice
          that cannot fail silently: the org's runner group is visibility=all
          with allows_public_repositories=false, so a public repository -- or
          any repository on the MarketDataApp user account -- can never reach
          the self-hosted runner, and a job that asks for it is not refused,
          it queues forever with no runner and nothing saying why. A private
          repository inside MarketData-App gets the self-hosted runner, which
          costs no Actions minutes and is the only place the Codex ChatGPT
          credential can live. Set this only to override that.
        type: string
        default: ''
      trusted-authors:
        description: >
          Extra logins allowed past the org-only gate, comma separated. For
          bot accounts, whose author_association is NONE or CONTRIBUTOR even
          when the bot is ours. Every name here must be an account the
          organisation controls.
        type: string
        default: ''
      bot-ref:
        description: >
          The tag or branch of the bot to run. There is no v1 tag yet; pin one
          here once it exists, so a caller is not tracking a moving branch.
        type: string
        default: main
      checkout-path:
        description: Where the pull request head is checked out.
        type: string
        default: pr
      app-id:
        description: >
          The GitHub App's numeric id. NOT a secret: an unauthenticated
          GET /apps/marketdata-code-review returns it. It is an input rather
          than a secret so a repository outside the MarketData-App
          organisation, which cannot read the org's secrets, has one fewer
          value to copy.
        type: string
        default: '4955329'
      force:
        description: >
          Review a commit that has already been reviewed. The bot skips an
          unchanged head by default, because `pull_request_target`'s `edited`
          type fires on a title or description tweak and would otherwise spend
          a full review rewriting the same comment. Asking the bot directly --
          `@marketdata-code-review re-review` -- also forces one.
        type: boolean
        default: false
      credential-store:
        description: >
          The private repository holding the Codex credential this job
          borrows. Read with the ORGANISATION App token, the same one the
          membership check uses, so a caller outside the organisation needs
          nothing extra. Set it to '' to turn borrowing off for a repository.
        type: string
        default: MarketData-App/code-review-credentials
    secrets:
      CODE_REVIEW_APP_ID:
        # Optional: the app-id input above carries the same value. Set this
        # only to override it.
        required: false
      CODE_REVIEW_APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false

jobs:
  review:
    # A CHEAP FIRST FILTER, NOT THE GATE.
    #
    # This expression cannot see the pull request's author on an issue_comment
    # or a workflow_dispatch event: those payloads carry the commenter, or
    # nothing at all. It only short-circuits the obvious case. The real
    # decision is the "Refuse a pull request from outside the organisation"
    # step, which runs before anything from the pull request is fetched, and
    # which is `reviewbot gate` -- unit tested, unlike a YAML expression.
    # A TRIGGER FILTER, NOT THE GATE. It deliberately does not look at
    # author_association, and that is not laziness.
    #
    # The event payload and the REST API disagree about it. Measured on
    # 2026-09-15, pull request #1, author MarketDataApp:
    #
    #   REST API      author_association: MEMBER
    #   event payload author_association: CONTRIBUTOR
    #
    # The payload computes the association from PUBLIC organisation
    # membership, and this org's public_members list is empty, so every member
    # reads as CONTRIBUTOR there. A filter on the payload value would have
    # refused every member of the organisation, on every pull request.
    #
    # So the only authorisation signal is `reviewbot gate` below, which asks
    # the API. The cost of filtering here on trigger alone is that an
    # outsider's pull request starts a job that mints a token and refuses:
    # nothing from the pull request is fetched, because every step after the
    # gate carries steps.gate.outputs.trusted == 'true' in its `if`. The
    # cleanup step at the end carries it too, combined with `always()` so it
    # still runs on failure and cancellation -- but never on a refused,
    # untrusted pull request, which must not reach the private credential
    # store at all.
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_dispatch'
    # Unset means derive it, and deriving is what stops a caller landing in the
    # silent queue described on the input above.
    runs-on: ${{ fromJSON(inputs.runs-on != '' && inputs.runs-on || (github.event.repository.private && '["self-hosted", "marketdata-docker"]' || '["ubuntu-latest"]')) }}
    # The job's own token stays read-only. Everything the bot writes, it
    # writes with the App installation token minted below.
    permissions:
      contents: read
    # A step's `if:` cannot read the `secrets` context -- GitHub allows it in
    # `env:` and `with:` only -- so the one secret-derived decision the steps
    # below need is computed here, once, as a plain boolean string. It carries
    # no secret material, only whether one is present.
    env:
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    concurrency:
      group: code-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    # Must exceed the credential wait PLUS the review, and the review is not
    # capped at `timeout_minutes`: `Backend.review` is `for attempt in (1, 2)`
    # around a call bounded by it, so one backend can legitimately take twice
    # that. With the shipped default of 15 the worst case is 30 for the model,
    # and the borrow step's wait is sized to outlast the lease TTL (itself
    # 2 x timeout_minutes + 5). 90 covers 40 + 30 with room for checkout and
    # setup. GitHub's own default is 360, far too long for a self-hosted runner
    # that takes one job at a time.
    timeout-minutes: 90
    steps:
      # If this job is ever skipped unexpectedly, the `if:` above evaluated
      # false and no step ran at all. This line is what tells you whether the
      # expression or the payload was at fault, next time.
      - name: Say what the gate expression saw
        run: |
          echo "event:       ${{ github.event_name }}"
          echo "pr author:   ${{ github.event.pull_request.user.login }}"
          echo "pr assoc:    ${{ github.event.pull_request.author_association }}"
          echo "comment by:  ${{ github.event.comment.author_association }}"
          echo "trusted-in:  '${{ inputs['trusted-authors'] }}'"
          echo "--- what each clause evaluates to ---"
          echo "assoc in list: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}"
          echo "inputs empty:  ${{ inputs['trusted-authors'] == '' }}"
          echo "is pr_target:  ${{ github.event_name == 'pull_request_target' }}"
          echo "assoc raw:     [${{ github.event.pull_request.author_association }}]"

      - name: Work out which pull request this is
        id: pr
        env:
          FROM_PR: ${{ github.event.pull_request.number }}
          FROM_ISSUE: ${{ github.event.issue.number }}
          FROM_INPUT: ${{ github.event.inputs.pr }}
        run: |
          number="${FROM_PR:-${FROM_ISSUE:-${FROM_INPUT:-}}}"
          if [ -z "$number" ]; then
            echo "No pull request number in this event; nothing to review."
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the App installation token
        id: app-token
        if: steps.pr.outputs.number != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODE_REVIEW_APP_ID || inputs.app-id }}
          private-key: ${{ secrets.CODE_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # A SECOND token, scoped to the organisation rather than to this
      # repository, and used for exactly one call: the membership lookup.
      #
      # Measured 2026-09-15, GET /orgs/MarketData-App/members/MarketDataDev02:
      #   MarketData-App (org)  installation -> 204 MEMBER
      #   MarketDataApp  (user) installation -> 404 not a member
      # 404, not 403: a user-account installation has no `members` permission
      # and GitHub answers as though the person were a stranger. Without this
      # token, every organisation member is refused on every sdk-* repository.
      #
      # continue-on-error: the bot still works without it, by falling back to
      # author_association, so a repository whose installation cannot mint it
      # degrades instead of failing.
      - name: Mint an organisation token for the membership check
        id: org-token
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CODE_REVIEW_APP_ID || inputs.app-id }}
          private-key: ${{ secrets.CODE_REVIEW_APP_PRIVATE_KEY }}
          owner: MarketData-App

      - name: Check out the bot
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          repository: MarketData-App/code-review-bot
          ref: ${{ inputs.bot-ref }}
          path: bot
          # The bot repository is private, so a caller in another repository
          # cannot read it with its own GITHUB_TOKEN. The App installation
          # token can: it holds contents:read on every repo the App is
          # installed on. This stays correct after the repo goes public.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install uv
        if: steps.pr.outputs.number != ''
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'

      - name: Install the bot
        if: steps.pr.outputs.number != ''
        run: uv sync --project bot

      # THE ORG-ONLY GATE. Nothing from the pull request has been fetched yet.
      # A model on this runner can read any file on the machine (spec section
      # 6), so an outsider's head must never land here -- on any trigger. The
      # decision is Python, not a YAML expression, so it can be and is tested.
      - name: Refuse a pull request from outside the organisation
        id: gate
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEWBOT_TRUSTED_AUTHORS: ${{ inputs.trusted-authors }}
          REVIEWBOT_ORG_TOKEN: ${{ steps.org-token.outputs.token }}
        run: |
          uv run --project bot reviewbot gate \
            --event "$GITHUB_EVENT_PATH" \
            --pr "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Check out the pull request head (read only)
        if: steps.gate.outputs.trusted == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          path: ${{ inputs.checkout-path }}
          fetch-depth: 1
          # No credentials in the checkout the model can read, and no
          # submodules: both would run code or fetch code from the PR.
          persist-credentials: false
          submodules: false

      # BORROWED, NOT STORED. The real credential never leaves skynet; what
      # lands here is a copy whose refresh token is a placeholder, so this job
      # cannot refresh anything and cannot cause `refresh_token_reused`
      # however many reviews run at once. See
      # docs/superpowers/specs/2026-09-16-codex-credential-leasing-design.md.
      #
      # CODEX_HOME is under RUNNER_TEMP on purpose. The self-hosted runner is
      # not --ephemeral, so anything written to a durable path would wait
      # there for the next job, which may belong to another repository.
      #
      # A repository that brings its own OPENAI_API_KEY never borrows. Its key
      # is the credential it uses, so taking the shared lease would deny Codex
      # to every other repository for the length of the review, and would put
      # a second credential on disk whose precedence the docs do not promise.
      #
      # The holder carries the run id. Two runs for the same repository and
      # pull request overlap routinely -- cancel-in-progress kills the first
      # while its `always()` check-in is still to come -- and a holder without
      # the run id makes the two indistinguishable, so the dying run frees the
      # live run's lease. See `release` in reviewbot/credentials.py.
      #
      # `|| echo fetched=false`: A CREDENTIAL PROBLEM MUST NEVER FAIL A
      # REVIEW. `reviewbot credential-checkout` exits 0 on every failure it
      # can name, but it cannot report on what happens before it runs: an
      # empty GITHUB_TOKEN (the org token mint above is continue-on-error, so
      # an empty token is an expected state) makes argparse exit 2 before the
      # command body is entered. Without the fallback that reds the whole
      # review. The command writes `fetched=` itself on every path that exits
      # 0, so the fallback runs only when nothing was written, and the value
      # the later steps read is never doubled or stale.
      # The Claude token, from the SAME store as the Codex credential, so
      # rotating it is one write instead of six. It used to live in an org
      # secret plus five `sdk-*` repository secrets, and an org secret cannot
      # reach those repos anyway -- they are on the MarketDataApp user account.
      # A repository that sets the secret itself keeps it.
      - name: Fetch the shared Claude token
        id: claude
        if: >
          steps.gate.outputs.trusted == 'true' &&
          inputs.credential-store != ''
        env:
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          uv run --project bot reviewbot credential-claude \
            --store "${{ inputs.credential-store }}" \
            || echo "fetched=false" >> "$GITHUB_OUTPUT"

      - name: Borrow the Codex credential
        id: codex
        if: >
          steps.gate.outputs.trusted == 'true' &&
          inputs.credential-store != '' &&
          env.HAS_OPENAI_API_KEY != 'true'
        env:
          # Two tokens, because they answer two different questions. The store
          # lives in the MarketData-App organisation, so the ORG token reads
          # the lease and the issued credential. The target repository's policy
          # is read with the token scoped to THAT repository -- the org
          # installation cannot see a private repository on the MarketDataApp
          # user account, where several sdk-* siblings live.
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
          REVIEWBOT_TARGET_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          uv run --project bot reviewbot credential-checkout \
            --store "${{ inputs.credential-store }}" \
            --holder "${{ github.repository }}#${{ steps.pr.outputs.number }}#${{ github.run_id }}-${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --codex-home "$RUNNER_TEMP/codex-home" \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.pr.outputs.number }}" \
            || echo "fetched=false" >> "$GITHUB_OUTPUT"

      - name: Install the model CLIs
        if: steps.gate.outputs.trusted == 'true'
        env:
          HAVE_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || steps.claude.outputs.fetched == 'true' }}
          HAVE_CODEX: ${{ steps.codex.outputs.fetched == 'true' || secrets.OPENAI_API_KEY != '' }}
        run: |
          set -eu
          # `|| true` on both: HAVE_CODEX is now true on every review that
          # borrowed a credential, not only on the rare API-key repository, so
          # a transient npm failure here would red every review. A missing CLI
          # is already an ordinary outcome -- `probe()` returns False for it
          # and the review runs with the backend that did install.
          if [ "$HAVE_CLAUDE" = "true" ] && ! command -v claude >/dev/null; then
            npm install -g @anthropic-ai/claude-code || true
          fi
          if [ "$HAVE_CODEX" = "true" ] && ! command -v codex >/dev/null; then
            npm install -g @openai/codex || true
          fi

      - name: Run the review
        if: steps.gate.outputs.trusted == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The code refuses an untrusted author too, in case a caller
          # workflow is misconfigured. Same list as the gate above.
          REVIEWBOT_TRUSTED_AUTHORS: ${{ inputs.trusted-authors }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          # The same organisation token the gate gets. Without it this step
          # cannot make the membership call, falls back to author_association,
          # and refuses every organisation member on a user-account
          # repository -- while the gate, which has the token, has just
          # allowed the same author. One job, two opposite answers.
          REVIEWBOT_ORG_TOKEN: ${{ steps.org-token.outputs.token }}
          REVIEWBOT_FORCE: ${{ inputs.force }}
        run: |
          uv run --project bot reviewbot run \
            --event "$GITHUB_EVENT_PATH" \
            --pr "${{ steps.pr.outputs.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --checkout "$GITHUB_WORKSPACE/${{ inputs.checkout-path }}"

      # The lease expires on its own after 20 minutes, so a job killed by
      # cancel-in-progress strands nothing. This step is still worth having:
      # it removes the credential from a runner whose filesystem persists, and
      # it frees the lease immediately rather than in twenty minutes.
      #
      # The holder and the condition are the borrow step's, character for
      # character. A check-in under a different holder frees a lease this run
      # never took; a check-in that runs when the borrow step was skipped asks
      # the store a question it has no business asking.
      - name: Return the Codex credential
        if: >
          always() &&
          steps.gate.outputs.trusted == 'true' &&
          inputs.credential-store != '' &&
          env.HAS_OPENAI_API_KEY != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.org-token.outputs.token }}
        run: |
          uv run --project bot reviewbot credential-checkin \
            --store "${{ inputs.credential-store }}" \
            --holder "${{ github.repository }}#${{ steps.pr.outputs.number }}#${{ github.run_id }}-${{ github.run_attempt }}" \
            --codex-home "$RUNNER_TEMP/codex-home" || true
