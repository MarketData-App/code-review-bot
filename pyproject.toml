[project]
name = "reviewbot"
version = "0.1.0"
description = "Automated pull-request reviewer for the Market Data repositories"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6.0.3",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.15.9"]

[project.scripts]
reviewbot = "reviewbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end smoke against a sandbox repo (excluded by default; run with `pytest -m e2e`)",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
# From ruff 0.16 onward `ruff format` also rewrites Python fences inside *.md.
# docs/ holds the spec and the implementation plan: illustrative code that must
# stay exactly as written. Reformatting it once broke an f-string in the plan.
exclude = ["docs/**/*.md", "*.md", "evals/cases/*.md"]
