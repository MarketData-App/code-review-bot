# Bot-wide defaults. A target repo overrides any subset of these in
# .github/code-review/policy.yml on its base branch. Nested maps merge key by
# key; lists replace whole.

# PRIORITY ORDER, and it decides more than which model answers. `mode: first`
# runs only the first LIVE backend, so with this default Claude reviews and
# Codex is built, probed and never invoked. `credential-checkout` knows that
# and declines the shared credential lease for any repository in this shape --
# holding one plan's lease for a backend that never runs would starve the
# repositories that do use it. A repository that wants Codex must put it first,
# or choose `mode: all`.
backends: [claude, codex]      # priority order; a missing credential drops one
mode: first                    # first | fallback | all
require_agreement: false       # all mode: single-backend findings do not block
models:
  claude: claude-opus-5
  codex: gpt-5.6-sol
codex_reasoning_effort: high
gate: true                     # check = failure on blocked, else success
require_ci_green: true         # blocked while the head commit's CI is red
proof:
  # WARNS, it does not block. The model still judges the evidence and still
  # asks for it under "Before merge"; what it no longer does is overwrite its
  # own verdict.
  #
  # This was `true`, and `paths: []` below means "every pull request", so the
  # gate applied to all of them. Measured on the first three real reviews:
  # sdk-py #122 scored patch 6/6 with ZERO findings and was still reported
  # Blocked, for missing runtime evidence alone. All three would have been
  # Blocked. A reviewer that blocks everything regardless of quality is a
  # reviewer people learn to ignore, which is worse than not having one.
  #
  # Turn it on per repository -- `proof: {required: true}` -- and pair it with
  # `paths` so it stays the FLOOR the comment below describes rather than a
  # blanket. The SDK repositories' money-handling paths are the case it was
  # built for.
  required: false              # runtime evidence requested, not enforced
  # ANY-match over the whole pull request, not a per-file filter: one matching
  # file switches the gate on for every file in the change. Its use is as a
  # FLOOR under the model's judgement -- a pull request touching nothing here
  # can never be blocked for missing proof, however the model labels it. Empty
  # means the gate applies to every pull request.
  # Note the asymmetry with auto_approve_paths below, which is ALL-match.
  paths: []
ratings: true                  # show the 1-6 tier row
decision_packets: true         # allow "decision needed" escalation
auto_approve: false            # approve via PR review when clean
auto_approve_paths: []         # approve only if all changed files match
auto_merge:
  enabled: false               # default off; SDK repos may enable
  method: squash               # squash | merge | rebase
  authors: []                  # allow list; empty = nobody
review_drafts: false
# The org-only gate (spec section 6). Everything outside these two settings
# gets no review, no comment and no check run. A bot account's association is
# NONE or CONTRIBUTOR even when the bot is ours, so bots go in trusted_authors.
# The organisation whose membership decides who may be reviewed. This is the
# real trust model: author_association describes a person's relationship to one
# REPOSITORY, and on the MarketDataApp user-account repos an org member reads
# as COLLABORATOR while a stranger invited to one repo reads as COLLABORATOR
# too. Membership tells them apart; association cannot.
organisation: MarketData-App
# Used only when the membership lookup is unavailable -- the App has not been
# granted Organization members:read, or GitHub is unwell. Then, and only then,
# the gate falls back to author_association.
# COLLABORATOR is deliberately absent: GitHub uses it for anyone invited to
# the repository at any permission level, read included, and such a person
# need not be in the organisation. A repo that wants them adds it here.
trusted_associations: [OWNER, MEMBER]
trusted_authors: []             # extra logins, for bot accounts
# Two jobs. A pull request whose files ALL match is skipped entirely, with no
# comment and no check run. And a matching file is dropped from the diff
# before the size budget is counted, so a large lockfile or fixture cannot
# spend the budget and hide the source beside it.
ignore_paths: ["**/*.lock", "**/dist/**"]
ignore_authors: ["dependabot[bot]", "marketdata-docs-sync[bot]"]
check_name: "Code review"
max_diff_kb: 400
timeout_minutes: 15
allow_ready_with_unseen_files: false   # the diff cap hid files; ready is refused
