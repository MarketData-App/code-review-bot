# Copy this to .github/workflows/code-review.yml in the target repository.
# Change the two things marked CHANGE ME and nothing else.
#
# This is the shape that works. It is not the obvious shape, and the comments
# say why, because every deviation below was paid for once already.

name: Code review

# WHEN A REVIEW HAPPENS: when CI goes green, or when a person asks.
#
# `pull_request_target` is deliberately ABSENT. It fires on `opened` and
# `synchronize` -- the moment CI STARTS -- and the bot refuses to review a
# commit whose checks are still running. Measured on sdk-py: its tests take
# about 75 seconds and a review reaches that gate in 30 to 40. So a
# push-triggered review finds CI pending, skips, and nothing brings it back.
# The run reports success while doing nothing, which is the failure hardest to
# notice. Do not add it back without reading `require_ci_green` first.
on:
  workflow_run:
    # CHANGE ME: the `name:` of every CI workflow whose result the review should
    # wait for -- not the filename. Name them ALL: the gate looks at every check
    # on the commit, so whichever finishes last is the one whose review actually
    # proceeds. The earlier triggers skip cheaply, and a repeat on the same head
    # skips too, so extra triggers are self-deduplicating rather than wasteful.
    workflows: ["Tests", "Lint"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      force:
        description: >
          Review a commit that has already been reviewed. The bot skips an
          unchanged head, so without this a re-dispatch is a no-op that
          reports success.
        type: boolean
        default: false

jobs:
  review:
    # THREE GUARDS, and each one cost a failed run to learn.
    #
    # 1. workflow_run fires for pushes to the default branch too, because CI
    #    runs there as well. Without the `workflow_run.event` check, every merge
    #    started a review job that minted App tokens, found no pull request and
    #    did nothing. `workflow_run.event` is what triggered the UPSTREAM run,
    #    so `pull_request` is the precise discriminator.
    # 2. A comment only starts a review when it is addressed to the bot, so
    #    saying thank you costs nothing.
    # 3. The reusable workflow refuses a workflow_run whose conclusion is not
    #    success, so a red CI run never reaches the model.
    if: >
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request') &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request != null &&
        startsWith(github.event.comment.body, '@marketdata-code-review')))
    uses: MarketData-App/code-review-bot/.github/workflows/review.yml@main
    # NOT `secrets: inherit`. That keyword only passes secrets to a reusable
    # workflow in the SAME organisation. A repository on the MarketDataApp user
    # account calling this one, owned by MarketData-App, crosses an owner
    # boundary and `inherit` delivers nothing: the call fails at evaluation with
    # "Secret CODE_REVIEW_APP_PRIVATE_KEY is required, but not provided while
    # calling", even though the secret is sitting in the repository's settings.
    # Naming them explicitly works on both sides of the boundary.
    secrets:
      CODE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CODE_REVIEW_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # CHANGE ME, if this repository is PUBLIC or lives outside the
      # MarketData-App organisation. Leave it out entirely for a private
      # organisation repository, which gets the self-hosted runner by default.
      #
      # The org's runner group is visibility=all with
      # allows_public_repositories=false. "all" means all repositories in the
      # ORGANISATION, so a public repo -- or any repo on the MarketDataApp user
      # account -- can never reach it, and a job that asks for it is not
      # refused: it queues forever with no runner and nothing saying why.
      runs-on: '["ubuntu-latest"]'
      # `|| false` is load-bearing. `inputs` exists only for
      # workflow_dispatch, so on a workflow_run or an issue_comment this is
      # null -- and a null against a boolean-typed input fails the ENTIRE
      # workflow at evaluation, with no job and no log, only "this run likely
      # failed because of a workflow file issue".
      force: ${{ inputs.force || false }}
      # If you ever pin `uses:` above to a branch or tag, pin this to the SAME
      # ref. `uses:` selects the WORKFLOW; `bot-ref` selects the bot CODE the
      # workflow checks out, and its default is `main`. A mismatch runs one
      # against the other and fails with "invalid choice" on whichever command
      # the older side has not got.
      # bot-ref: main
