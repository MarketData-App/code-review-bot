name: Code review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      force:
        description: Review a commit that has already been reviewed
        type: boolean
        default: false

jobs:
  review:
    # Only run for a comment that is actually addressed to the bot.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '@marketdata-code-review'))
    uses: MarketData-App/code-review-bot/.github/workflows/review.yml@main
    # Named explicitly, NOT `secrets: inherit`.
    #
    # `inherit` only passes the caller's secrets to a reusable workflow in the
    # SAME organisation. This repository is owned by MarketData-App and the
    # sdk-* repositories are owned by the MarketDataApp user account, so
    # `inherit` crosses an owner boundary and delivers nothing. The call then
    # fails before any step runs, with an error naming a secret that is
    # sitting in the repository's settings:
    #
    #   Error when evaluating 'secrets' ... Secret
    #   CODE_REVIEW_APP_PRIVATE_KEY is required, but not provided while calling
    #
    # The explicit form works on both sides of that boundary. There is no case
    # where `inherit` works and this does not, so this is the default.
    secrets:
      CODE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CODE_REVIEW_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Only if this repository runs the Codex backend:
      # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      force: ${{ inputs.force }}
      # REQUIRED for a public repository, and for any repository outside the
      # MarketData-App organisation. The default is the org's self-hosted
      # runner, and its runner group is visibility=all with
      # allows_public_repositories=false -- "all" means all repositories in
      # the ORGANISATION. A public repo, or a repo on the MarketDataApp user
      # account, can never reach it. The job does not fail in that case: it
      # queues forever with no runner and nothing says why.
      runs-on: '["ubuntu-latest"]'
    # A PRIVATE repository inside MarketData-App uses the self-hosted runner
    # instead, which costs no Actions minutes and is the only place the Codex
    # ChatGPT credential can live:
    #   runs-on: '["self-hosted", "marketdata-docker"]'
    #
    # A repository whose own bot opens pull requests adds that bot's login,
    # which must be an account the organisation controls:
    #   trusted-authors: 'sdk-sync[bot]'
